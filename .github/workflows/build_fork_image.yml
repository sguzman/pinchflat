# This workflow is intentionally manual-only. It does not run on push, PR, or release.
# Never publish to the upstream author's Docker Hub namespace from this fork.
name: Build fork image (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-fork-image
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'sguzman/pinchflat'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish only to fork-owned GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/selfhosted.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sguzman/pinchflat:dev
          labels: |
            org.opencontainers.image.source=https://github.com/sguzman/pinchflat
          cache-from: type=gha
          cache-to: type=gha,mode=max
