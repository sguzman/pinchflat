# Disposable CI workflow on a dedicated branch. Delete after it starts.
# Does not run on master, pull requests, or releases.
name: Verify live-progress image and publish

on:
  push:
    branches:
      - ci/one-shot-progress-image-20261115

permissions:
  contents: read

jobs:
  build-smoke-publish:
    if: github.repository == 'sguzman/pinchflat' && github.ref == 'refs/heads/ci/one-shot-progress-image-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout merged live-progress code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image locally without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/selfhosted.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/sguzman/pinchflat:progress-candidate
          labels: |
            org.opencontainers.image.source=https://github.com/sguzman/pinchflat
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test bundled executables
        run: |
          docker run --rm --entrypoint /usr/bin/ffmpeg ghcr.io/sguzman/pinchflat:progress-candidate -version
          docker run --rm --entrypoint /usr/local/bin/yt-dlp ghcr.io/sguzman/pinchflat:progress-candidate --version

      - name: Verify actual yt-dlp JSON progress from a local-only HTTP test file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pinchflat-progress-http"
          dd if=/dev/urandom of="$RUNNER_TEMP/pinchflat-progress-http/smoke.mp4" bs=1M count=3 status=none
          python3 -m http.server 18945 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pinchflat-progress-http" > "$RUNNER_TEMP/pinchflat-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          docker run --rm --network host --entrypoint /usr/local/bin/yt-dlp \
            ghcr.io/sguzman/pinchflat:progress-candidate \
            --quiet --progress --newline --progress-delta 1 \
            --progress-template 'download:PINCHFLAT_PROGRESS:%(progress)j' \
            --limit-rate 256K --no-simulate \
            -o '/tmp/pinchflat-smoke.%(ext)s' \
            'http://127.0.0.1:18945/smoke.mp4' > "$RUNNER_TEMP/pinchflat-progress.log" 2>&1
          grep '^PINCHFLAT_PROGRESS:' "$RUNNER_TEMP/pinchflat-progress.log" \
            | sed 's/^PINCHFLAT_PROGRESS://' \
            | jq -e 'select(.status == "downloading" and .downloaded_bytes > 0)' > /dev/null
          echo "Verified real yt-dlp structured progress events"

      - name: Smoke test app healthcheck with disposable config and media folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pinchflat-smoke-config" "$RUNNER_TEMP/pinchflat-smoke-media"
          docker run -d --name pinchflat-progress-smoke \
            -p 127.0.0.1:28945:8945 \
            -v "$RUNNER_TEMP/pinchflat-smoke-config:/config" \
            -v "$RUNNER_TEMP/pinchflat-smoke-media:/downloads" \
            -e TZ=UTC \
            ghcr.io/sguzman/pinchflat:progress-candidate
          trap 'docker logs pinchflat-progress-smoke || true; docker rm -f pinchflat-progress-smoke >/dev/null 2>&1 || true' EXIT
          ok=false
          for n in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:28945/healthcheck; then
              ok=true
              break
            fi
            sleep 2
          done
          test "$ok" = true
          echo "Verified app healthcheck on disposable instance"

      - name: Log in to fork-owned GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only after all smoke tests pass
        shell: bash
        run: |
          set -euo pipefail
          docker tag ghcr.io/sguzman/pinchflat:progress-candidate ghcr.io/sguzman/pinchflat:dev
          docker push ghcr.io/sguzman/pinchflat:dev
