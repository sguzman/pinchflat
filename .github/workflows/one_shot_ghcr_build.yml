# Disposable workflow. Its only purpose is to build the already-tested fork image
# without requiring a manual GitHub Actions button or any Docker Hub credentials.
# This file lives ONLY on the ci/one-shot-ghcr-20261115 branch.
name: One-shot GHCR image build

on:
  push:
    branches:
      - ci/one-shot-ghcr-20261115

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.repository == 'sguzman/pinchflat' && github.ref == 'refs/heads/ci/one-shot-ghcr-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested master source plus one-shot workflow
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to fork-owned GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fork-only amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/selfhosted.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sguzman/pinchflat:dev
          labels: |
            org.opencontainers.image.source=https://github.com/sguzman/pinchflat
          cache-from: type=gha
          cache-to: type=gha,mode=max
