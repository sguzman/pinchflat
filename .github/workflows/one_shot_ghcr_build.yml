# Ephemeral one-shot build from PR #5, to be deleted immediately after launch.
name: Validate and publish fork image (one shot)

on:
  push:
    branches:
      - ci/one-shot-ghcr-ffmpeg-20261115

permissions:
  contents: read

jobs:
  validate-and-publish:
    if: github.repository == 'sguzman/pinchflat' && github.ref == 'refs/heads/ci/one-shot-ghcr-ffmpeg-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source with fixed FFmpeg download
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally before publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/selfhosted.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/sguzman/pinchflat:dev
          labels: |
            org.opencontainers.image.source=https://github.com/sguzman/pinchflat
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test FFmpeg and yt-dlp
        run: |
          docker run --rm --entrypoint /usr/bin/ffmpeg ghcr.io/sguzman/pinchflat:dev -version
          docker run --rm --entrypoint /usr/local/bin/yt-dlp ghcr.io/sguzman/pinchflat:dev --version

      - name: Publish validated image only to this fork
        run: docker push ghcr.io/sguzman/pinchflat:dev
